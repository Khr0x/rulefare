name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          check-latest: true # usar el parche vigente de la línea de go.mod
      - name: Check formatting
        run: |
          unformatted="$(find . -name '*.go' -type f -exec gofmt -l {} +)"
          test -z "$unformatted" || { echo "$unformatted"; exit 1; }
      - name: Check module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Check engine dependency boundary
        run: |
          imports=$(go list -f '{{join .Imports " "}}' ./engine)
          read -r -a packages <<< "$imports"
          external=$(go list -f '{{if not .Standard}}{{.ImportPath}}{{end}}' "${packages[@]}")
          while IFS= read -r dependency; do
            case "$dependency" in
              ""|github.com/google/cel-go/*) ;;
              *) printf 'Forbidden engine import: %s\n' "$dependency" >&2; exit 1 ;;
            esac
          done <<< "$external"
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - name: Fuzz rulesets, CEL and contexts
        run: |
          for target in FuzzCompileRuleset FuzzRuleCondition FuzzEvaluateContext; do
            go test ./engine -run '^$' -fuzz "^${target}$" -fuzztime=10s -parallel=2 -timeout=2m
          done
      - name: Benchmark engine
        run: bash scripts/benchmark.sh bin/benchmarks --container
      - name: Measure idle CPU and evaluation I/O
        run: bash scripts/measure-system.sh bin/system
      - name: Save benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-benchmarks-${{ github.sha }}
          path: |
            bin/benchmarks/*.txt
            bin/system/*.txt
          if-no-files-found: warn
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...
